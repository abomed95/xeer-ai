# Spec DigitalOcean App Platform — déploiement de Xeer AI.
#
# Déploiement en 1 clic :
#   https://cloud.digitalocean.com/apps/new?repo=https://github.com/abomed95/xeer-ai/tree/main
#
# Par défaut : MODE DÉMO (comptes, quotas, paiements sandbox et admin, sans clé
# OpenAI ni index vectoriel). Build léger via requirements-demo.txt (tient dans
# une instance basic 512 Mo).
#
# ── Passer en MODE COMPLET (vraie IA OpenAI + RAG) ─────────────────────────
#   1. build_command : pip install -r requirements.txt   (index vectoriel requis)
#   2. XEER_DEMO_MODE : "0"
#   3. Ajoute le secret OPENAI_API_KEY (dashboard DO → Settings → App-Level Env)
#      avec une clé OpenAI valide, et vérifie OPENAI_MODEL (modèle réel).
#   4. instance_size_slug : au moins basic-xs (le RAG charge des modèles lourds).
name: xeer-ai-demo
region: fra   # Francfort (proche Djibouti/Europe) — change si besoin
services:
  - name: web
    github:
      repo: abomed95/xeer-ai
      branch: main
      deploy_on_push: true
    environment_slug: python
    build_command: pip install -r requirements-demo.txt
    run_command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    instance_size_slug: basic-xxs   # ~5 $/mois (App Platform n'a pas de tier gratuit pour les services)
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /
    envs:
      - key: XEER_DEMO_MODE
        value: "1"
      - key: XEER_PAYMENTS_MODE
        value: sandbox
      - key: XEER_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: "change-me-en-une-longue-chaine-aleatoire"
      - key: XEER_ADMIN_EMAIL
        value: admin@xeer.ai
      - key: XEER_ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: xeer-demo-2026
      # Modèle OpenAI réel (utilisé uniquement en mode complet, XEER_DEMO_MODE=0).
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # En mode complet, ajoute aussi le secret OPENAI_API_KEY depuis le
      # dashboard DigitalOcean (ne jamais committer une vraie clé ici) :
      # - key: OPENAI_API_KEY
      #   scope: RUN_TIME
      #   type: SECRET
      #   value: sk-...

# Spec DigitalOcean App Platform — Xeer AI en MODE COMPLET (vraie IA OpenAI + RAG).
#
# Déploiement en 1 clic :
#   https://cloud.digitalocean.com/apps/new?repo=https://github.com/abomed95/xeer-ai/tree/main
#
# Ce que fait cette spec :
#   • installe les dépendances complètes (ChromaDB, Sentence Transformers, openai) ;
#   • CONSTRUIT l'index vectoriel au build depuis data/pages/clean (131 pages
#     versionnées) — sans quoi le RAG répondrait « collection introuvable » ;
#   • lance l'API avec XEER_DEMO_MODE=0, donc réponses générées par OpenAI.
#
# ⚠️ SEULE ÉTAPE MANUELLE — la clé OpenAI (jamais committée dans ce dépôt) :
#   Dashboard DO → ton app → Settings → App-Level Environment Variables
#     key   = OPENAI_API_KEY
#     value = sk-...        (coche « Encrypt » pour en faire un secret)
#   Puis « Save » : DigitalOcean redéploie et l'IA réelle est active.
#
# Filet de sécurité : sans clé valide, l'app ne plante pas — elle retombe
# automatiquement en réponses de démonstration (voir app/config.py). Vérifie
# l'état à tout moment sur /api/health (champs demo_mode et rag_ready).
name: xeer-ai-demo   # nom conservé : le changer créerait une nouvelle app sur DO
region: fra   # Francfort (proche Djibouti/Europe) — change si besoin
services:
  - name: web
    github:
      repo: abomed95/xeer-ai
      branch: main
      deploy_on_push: true
    environment_slug: python
    # Torch en version CPU d'abord : ~5x plus léger que la version CUDA par
    # défaut, indispensable pour tenir dans le build DigitalOcean.
    build_command: |
      pip install --upgrade pip
      pip install torch --index-url https://download.pytorch.org/whl/cpu
      pip install -r requirements.txt
      python scripts/build_vector_store.py
    run_command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Le RAG charge un modèle d'embeddings multilingue en mémoire : 512 Mo
    # (basic-xxs) ne suffisent pas — basic-s (2 Go) est le palier confortable.
    instance_size_slug: basic-s
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /api/health
    envs:
      # Mode complet : réponses générées par l'API OpenAI sur la base du corpus.
      - key: XEER_DEMO_MODE
        value: "0"
      - key: XEER_PAYMENTS_MODE
        value: sandbox
      - key: XEER_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: "change-me-en-une-longue-chaine-aleatoire"
      - key: XEER_ADMIN_EMAIL
        value: admin@xeer.ai
      - key: XEER_ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: xeer-demo-2026
      # Modèle OpenAI réel (gpt-4o pour une qualité supérieure).
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Emplacement de l'index vectoriel construit au build.
      - key: XEER_CHROMA_DIR
        value: chroma_db
      # OPENAI_API_KEY : à ajouter depuis le dashboard DigitalOcean (voir en-tête).
      # Ne jamais committer une vraie clé dans ce fichier.
